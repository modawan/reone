name: Build and run tests on Windows
runs:
  using: "composite"
  steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Restore vcpkg
      uses: actions/cache@v4
      id: vcpkg-installed
      with:
        path: ${{ env.VCPKG_ROOT }}/installed
        key: ${{ runner.os }}-vcpkg-installed-v3
        restore-keys: |
          ${{ runner.os }}-vcpkg-installed-v3

    - name: Install dependencies
      shell: bash
      if: steps.vcpkg-installed.outputs.cache-hit != 'true'
      run: |-
        vcpkg install --triplet x64-windows \
          boost-algorithm boost-endian boost-format boost-functional boost-program-options boost-json \
          glm sdl2 sdl3 glew openal-soft libmad ffmpeg wxwidgets gtest

    - name: Configure ccache
      shell: bash
      run: echo "CCACHE_SLOPPINESS=pch_defines,time_macros" >> $GITHUB_ENV

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: windows
        max-size: 1G
        evict-old-files: job
        save: ${{github.event_name == 'push' && github.ref == 'refs/heads/master'}}

    - name: Configure CMake
      shell: cmd
      run: |-
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
        call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
        mkdir build
        cmake -S . -B build ^
          -G Ninja ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DVCPKG_TARGET_TRIPLET=x64-windows ^
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      shell: cmd
      working-directory: ${{github.workspace}}/build
      run: |-
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
        call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
        cmake --build . --config Release

    - name: Run tests
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: ctest -VV -C Release
