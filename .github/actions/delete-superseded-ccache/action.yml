name: 'Delete superseded ccache caches'
inputs:
  key:
    description: "Prefix of the ccache cache keys to clean up"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/github-script@v7
      env:
        KEY: ${{ inputs.key }}
      with:
        script: |
          const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            key: process.env.KEY,
            ref: 'refs/heads/master',
            sort: 'created_at',
            direction: 'desc',
          });
          for (const cache of caches.slice(1)) {
            core.info(`Deleting ${cache.key}`);
            await github.rest.actions.deleteActionsCacheById({
              owner: context.repo.owner,
              repo: context.repo.repo,
              cache_id: cache.id,
            });
          }
