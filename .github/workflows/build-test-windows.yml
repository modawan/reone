name: Build and run tests on Windows
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Only pushes to master share a group; other runs remain independent.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: C:/vcpkg

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows

  delete-superseded-ccache:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    concurrency: delete-superseded-ccache-windows
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/delete-superseded-ccache
        with:
          key: ccache-windows-
