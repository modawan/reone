name: Build and run tests with Nix
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Builds every application, runs the unit tests, the install check and
      # the run-wrapper tests. No binary cache, so each run is a full build.
      - name: nix flake check
        run: nix flake check -L
