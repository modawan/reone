name: Build and run tests with Nix
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its earlier run, which would
# otherwise go on for a full build. Runs on master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Builds every application, runs the unit tests, the install check and
      # the run-wrapper tests. No binary cache, so each run is a full build.
      - name: nix flake check
        run: nix flake check -L
