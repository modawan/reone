name: Check the Nix flake
# Runs only when the flake or this workflow changes. The C++ build and its
# tests are already covered by the Linux and Windows workflows, so a pull
# request gets the fast check: every flake output evaluates and the run
# wrapper's tests pass. The full package build (every application, the unit
# tests and the install check, about 25 minutes with no binary cache) runs
# for a release tag, or when started by hand with "full". A CMake change
# that breaks only the Nix package is therefore caught by the next release
# or manual run, not on its pull request.
on:
  push:
    branches: [master]
    # Release versions such as 0.22.0, not the moving nightly tag. Paths
    # filters don't apply to tag pushes, so a release always builds in full.
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/build-test-nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/build-test-nix.yml
  workflow_dispatch:
    inputs:
      full:
        description: Build the whole package and run its tests (slow)
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels its earlier run. Runs on master are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate every flake output
        if: ${{ !(inputs.full || startsWith(github.ref, 'refs/tags/')) }}
        run: nix flake check --no-build -L
      - name: Run the wrapper tests
        if: ${{ !(inputs.full || startsWith(github.ref, 'refs/tags/')) }}
        run: nix build -L .#checks.x86_64-linux.reone-run
      - name: Build the package and run all checks
        if: ${{ inputs.full || startsWith(github.ref, 'refs/tags/') }}
        run: nix flake check -L
