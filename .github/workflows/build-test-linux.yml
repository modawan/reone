name: Build and run tests on Linux
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: "ubuntu:25.10"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-linux

  delete-superseded-ccache:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    concurrency: delete-superseded-ccache-linux
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/delete-superseded-ccache
        with:
          key: ccache-linux-
